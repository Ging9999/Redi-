name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity (needed by the e2e hook tests)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Package installs and console script works
        run: |
          pip install .
          redi --help
          redi hook pre-tool-use < /dev/null   # no stdin event -> no-op, exit 0

      - name: Installer dry-run smoke check
        run: python3 -m redi.install --dry-run --settings /tmp/settings.json

      - name: Build the zipapp
        run: python3 tools/build_pyz.py && python3 dist/redi.pyz --help
